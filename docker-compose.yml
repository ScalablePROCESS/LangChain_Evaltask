version: "3.9"

services:
  langchain-server:
    build: .
    container_name: langchain-evaltask
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_VERSION=${APP_VERSION:-2.0.0}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-not-safe}
      - JWT_EXPIRY_LEEWAY_SECONDS=${JWT_EXPIRY_LEEWAY_SECONDS:-30}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-z-ai/glm-5.2}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_TIMEOUT_SECONDS=${OPENROUTER_TIMEOUT_SECONDS:-60}
      - OPENROUTER_MAX_RETRIES=${OPENROUTER_MAX_RETRIES:-2}
      - CHROMA_PERSIST_DIR=/app/data/chromadb
      - CHROMA_MAX_RESULTS=${CHROMA_MAX_RESULTS:-5}
      - EMBEDDING_PROVIDER_URL=${EMBEDDING_PROVIDER_URL:-https://openrouter.ai/api/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - CONVERSATION_TTL_SECONDS=${CONVERSATION_TTL_SECONDS:-3600}
      - CONVERSATION_MAX_MESSAGES=${CONVERSATION_MAX_MESSAGES:-50}
      - MAX_TOOL_ROUNDS=${MAX_TOOL_ROUNDS:-5}
      - MAX_TOKENS=${MAX_TOKENS:-4096}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DEBUG=${DEBUG:-false}
    volumes:
      - chromadb_data:/app/data/chromadb
      - knowledge_data:/app/data/knowledge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: langchain-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  chromadb_data:
    driver: local
  knowledge_data:
    driver: local
  redis_data:
    driver: local
